      timestamps, resolution strategy). NOT YET bound."
    quality_dialect: "provisional (user-reported): strong on FAST-ACTION clips vs H3 Max; pricier."
    dims: "TO FETCH (drives keyframe AR + possible frame-pair)"
    frame_pair: "CHECK — Seedance generally supports refs/pairs; confirm for this stage"
    source_of_truth: ["https://fal.ai/models/seedance"]
    last_verified: null
    verified_by: null

  - id: nanobanana-pro-edit
    stage: keyframe        # user's example: use for the EDIT step only; contained, no video cascade
    name: nanobanana pro (edit)
    model: "TBD (OpenArt host tool — check availability via fal/OpenArt)"
    state: recognized-unmapped
    prompt_dialect: "HAS prior art: nanobanana pro on OpenArt; @tag style references in prompt text.
      NOT YET bound for the keyframe-edit deliverable."
    quality_dialect: "UNKNOWN — do not inherit gpt-image-2's vocabulary; verify by smoke test."
    dims: "TO FETCH / decide (must still match video binding's AR)"
    frame_pair: false
    source_of_truth: ["https://openart.ai"]
    last_verified: null
    verified_by: null

