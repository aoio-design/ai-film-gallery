<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ season.title }} — CONSUME Gallery</title>
<style>
:root {
  --bg:#0a0c12; --bg2:#0e1119; --panel:#131722; --panel2:#171c29;
  --line:#242b3d; --text:#e8ebf2; --mut:#96a0b4;
  --gold:#c9a86a; --gold-hi:#ddc089; --gold-dim:rgba(201,168,106,.12);
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
}
/* light mode (same as Guide site) */
html.light {
  --bg:#f4f3ef; --bg2:#fbfaf7; --panel:#ffffff; --panel2:#f0eee7;
  --line:#ded9cc; --text:#232a3a; --mut:#6b7280;
  --gold:#a67c2e; --gold-hi:#8f6a22; --gold-dim:rgba(166,124,46,.12);
  --ok:#2f8f63; --danger:#c24557;
}
#theme-toggle { position:fixed; top:14px; right:18px; z-index:120; cursor:pointer;
  font-size:17px; width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line); border-radius:50%;
  box-shadow:0 6px 18px rgba(0,0,0,.25); user-select:none; }
#theme-toggle:hover { border-color:var(--gold); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 24px;
}
.container { max-width: 900px; margin: 0 auto; }
.back { color: var(--gold); text-decoration: none; font-size: 13px; }
.back:hover { color: var(--gold-hi); text-decoration: underline; }
h1 { font-family: var(--serif); font-size: 26px; margin: 12px 0 6px; color: var(--text); }
.subtitle { color: var(--mut); font-size: 14px; margin-bottom: 24px; }

.bible-link {
  display: inline-block;
  background: var(--gold-dim); border: 1px solid var(--gold); color: var(--gold);
  padding: 10px 18px; border-radius: 8px; text-decoration: none;
  font-size: 14px; font-weight: 600; margin-bottom: 28px;
}
.bible-link:hover { background: var(--gold); color: #0b0e14; }

h2 { font-family: var(--serif); font-size: 17px; color: var(--gold-hi); margin: 8px 0 14px; }
.ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
a.ep {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px; text-decoration: none; color: var(--text);
  transition: border-color .15s, background .15s;
}
a.ep:hover { border-color: var(--gold); background: var(--gold-dim); }
a.ep .num { font-size: 11px; color: var(--gold); letter-spacing: .1em; text-transform: uppercase; }
a.ep .ttl { font-size: 15px; font-weight: 600; margin-top: 4px; }
a.ep .meta { font-size: 12px; color: var(--mut); margin-top: 6px; }
</style>
</head>
<body>
<div id="theme-toggle" onclick="toggleTheme()" title="Toggle light / dark mode">🌙</div>
<script>
(function(){var t=localStorage.getItem('aio-theme');if(t==='light'){document.documentElement.classList.add('light');var b=document.getElementById('theme-toggle');if(b)b.textContent='☀️'}})();
function toggleTheme(){var h=document.documentElement;h.classList.toggle('light');var l=h.classList.contains('light');localStorage.setItem('aio-theme',l?'light':'dark');document.getElementById('theme-toggle').textContent=l?'☀️':'🌙'}
</script>
<div class="container">
  <a href="/projects" class="back">← Gallery</a>
  <h1>{{ season.title }}</h1>
  <p class="subtitle">{{ season.episodes|length }} episodes</p>
  <a class="bible-link" href="/a/{{ season.id }}">📖 Character Bible &amp; Assets →</a>
  <h2>Episodes</h2>
  <div class="ep-grid">
    {% for ep in season.episodes %}
    <a class="ep" href="/p/{{ ep.id }}">
      <div class="num">{{ ep.id }}</div>
      <div class="ttl">{{ ep.title }}</div>
      <div class="meta">{{ ep.shots }} shots</div>
    </a>
    {% endfor %}
  </div>
</div>
</body>
</html>
