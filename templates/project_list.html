<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — CONSUME Gallery</title>
<style>
:root {
  --bg:#0a0c12; --bg2:#0e1119; --panel:#131722; --panel2:#171c29;
  --line:#242b3d; --text:#e8ebf2; --mut:#96a0b4;
  --gold:#c9a86a; --gold-hi:#ddc089; --gold-dim:rgba(201,168,106,.12);
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  padding: 40px 24px;
}
.container { max-width: 800px; margin: 0 auto; }
h1 { font-family: var(--serif); font-size: 28px; margin-bottom: 8px; color: var(--text); }
h1 span { color: var(--gold); }
.subtitle { color: var(--mut); margin-bottom: 32px; font-size: 14px; }
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--gold-hi); text-decoration: underline; }
.project-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 24px;
  margin-bottom: 16px;
  transition: border-color .2s;
}
.project-card:hover { border-color: var(--gold); background: var(--gold-dim); }
.project-card h2 { font-size: 18px; margin-bottom: 6px; color: var(--text); }
.project-card .meta { color: var(--mut); font-size: 13px; }
.logout { float: right; color: var(--mut); font-size: 13px; }
.logout:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="container">
  <a href="/logout" class="logout">Logout</a>
  <h1>CONSUME <span>Gallery</span></h1>
  <p class="subtitle">AI film production — shot-by-shot gallery</p>
  {% if not projects %}
    <p>No projects yet.</p>
  {% endif %}
  {% for p in projects %}
  <a href="/p/{{ p.id }}">
    <div class="project-card">
      <h2>{{ p.title }}</h2>
      <div class="meta">{{ p.shots|length }} shots</div>
    </div>
  </a>
  {% endfor %}
</div>
</body>
</html>
